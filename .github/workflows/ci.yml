name: Continuous integration

# Pull requests (from this repository or from forks) are tested through the
# pull_request event only. Pushes are limited to master and tags, so a push
# to a PR branch does not start a second, skipped run next to the real one.
# To test or publish an image for a branch without a PR, start the workflow
# by hand (workflow_dispatch).
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Default to the minimum permissions the GITHUB_TOKEN needs. Jobs that
# need more (e.g. pushing container images) grant it explicitly below.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.services }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same versions as production (see c2corg/v6-docker-compose):
          # the production PostgreSQL image (PostgreSQL 9.6.1, PostGIS 2.3)
          # and Redis 5. Bump them together with production.
          - services: prod
            postgres: c2corg/c2corg_pgsql:9.6
            redis: redis:5
          # Latest releases, to see early what a server upgrade would break.
          - services: latest
            postgres: postgis/postgis:latest
            redis: redis:latest
    services:
      redis:
        image: ${{ matrix.redis }}
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # elasticsearch:
      #   image: elasticsearch:6.8.14
      #   options: >-
      #     --health-cmd "curl -f http://localhost:9200"
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5
      #   ports:
      #     - 9200:9200
      #     - 9300:9300
      #   env:
      #     discovery.type: single-node
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install python dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check c2corg_api es_migration
      - name: Configure postgres
        run: |
          scripts/database/create_test_schema.sh
        env:
          PGPASSWORD: test
          PGUSER: postgres
          PGHOST: localhost
          PGPORT: 5432
      - name: Create config from templates
        run: make CONFIG=config/env.test load-env
      - name: Install java 8 for (old) elasticsearch
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: 8
      - name: Run (old) elasticsearch
        run: |
          set -e
          mkdir /tmp/elasticsearch
          ES_URL="https://download.elasticsearch.org/elasticsearch/release/org/elasticsearch/distribution/tar/elasticsearch/2.4.6/elasticsearch-2.4.6.tar.gz"
          # This 2016-era release is served from the old
          # download.elasticsearch.org CDN, not artifacts.elastic.co (used
          # for versions >= 5.x), which does not publish a .sha512 file for
          # it: only .sha1/.md5/.asc are available there. Verify against
          # the .sha1 checksum instead of downloading unverified.
          curl -sSfL "$ES_URL" -o /tmp/elasticsearch.tar.gz
          curl -sSfL "$ES_URL.sha1" -o /tmp/elasticsearch.tar.gz.sha1
          echo "$(cat /tmp/elasticsearch.tar.gz.sha1)  /tmp/elasticsearch.tar.gz" | sha1sum -c -
          tar xz -f /tmp/elasticsearch.tar.gz --directory=/tmp/elasticsearch --strip-components=1
          /tmp/elasticsearch/bin/plugin install analysis-icu
          /tmp/elasticsearch/bin/elasticsearch --daemonize --path.data /tmp
          sleep 30 # ElasticSearch takes few seconds to start, make sure it is available when the build script runs
      - run: curl -v http://localhost:9200
      - name: Run tests (with secrets)
        # Dependabot runs do not get the repository secrets
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          NAVITIA_API_KEY: ${{ secrets.NAVITIA_API_KEY }}
        run: |
          export $(cat .env | grep -v "^#" | grep -v "^NAVITIA_API_KEY" | xargs)
          export NAVITIA_API_KEY="${NAVITIA_API_KEY:-test-key}"
          pytest --cov-report term --cov-report xml --cov=c2corg_api
      - name: Run tests (without secrets)
        # secrets are not available for dependabot runs
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          export $(cat .env | grep -v "^#" | xargs)
          export NAVITIA_API_KEY="${NAVITIA_API_KEY:-test-key}"
          pytest --cov-report term --cov-report xml --cov=c2corg_api -k "not test_navitia"
      - name: Send coverage to codacy
        # secrets are not available for PR from forks, and dependabot PRs
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && matrix.services == 'prod' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  Docker:
    # only publish if tests passed
    needs: test
    # secrets are not available for PR from forks, and dependabot PRs, we don't want to build them
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # needed to push the image to ghcr.io
      packages: write
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/c2corg/v6_api
      - name: Checkout repository
        uses: actions/checkout@v7
      - run: git archive --format=tar --output project.tar "$GITHUB_SHA"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Publish the docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          provenance: false # true creates issues with the old docker compose used in prod
          # BuildKit defaults to OCI media types under the docker-container
          # driver, which some environments still consuming this image
          # cannot read at all (unlike provenance, this isn't optional
          # metadata - it silently breaks `docker pull` with a generic
          # "not found"). Force the classic Docker manifest format instead.
          # Naming stays on the `tags:` input below (handled as repeated
          # --tag flags, so multiple tags work fine) - buildx's --output
          # name= does NOT accept a comma-separated list of tags, it errors
          # on the second one (verified locally before pushing this).
          tags: ${{ steps.docker_meta.outputs.tags }}
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},oci-mediatypes=false
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}

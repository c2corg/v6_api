services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
    # Elasticsearch 2.4 with the index of the dev database (built with it by scripts/dev-database/publish.sh,
    # same tag). The data is in /esdata, a volume which starts from the content of the image.
    image: ghcr.io/c2corg/c2corg-dev-es:latest
    command: elasticsearch -Des.path.data=/esdata -Des.index.number_of_replicas=0 -Des.script.inline=true
    environment:
      ES_HEAP_SIZE: 512m
    volumes:
      - es_data:/esdata
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  es_data:

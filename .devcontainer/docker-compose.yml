services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "127.0.0.1:6543:6543"
    command: sleep infinity
    # No core dumps: a crashed Node/Chromium process (Playwright, vitest) writes a core file
    # as big as its address space (20 GB+) into its working directory, which fills the
    # container's writable layer
    ulimits:
      core: 0
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Navitia settings, read with os.getenv() by the API (the server does not load .env, only the tests do)
    env_file: ../.env
    environment:
      # Point services to their container hostnames
      PGHOST: postgresql
      PGUSER: postgres
      PGPASSWORD: test
      CONFIG: config/env.devcontainer
      ES_INDEX_URL: http://elasticsearch:9200/c2corg
      # alembic_migration has no __init__.py, so the editable install does not expose it:
      # without this, initialize_c2corg_api_db only works when run from /workspace
      PYTHONPATH: /workspace

  postgresql:
    # PostgreSQL 18 + PostGIS with a lightweight anonymized database (scripts/dev-database): it is restored
    # at the first start, a minute or so. The volume is mounted on /var/lib/postgresql (the layout of the
    # PostgreSQL 18 images), not on /var/lib/postgresql/data.
    image: ghcr.io/c2corg/c2corg-dev-db:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      # the restore ends with a checkpoint which can take more than the 60 s pg_ctl waits by default
      # on a slow disk (the first start would then fail)
      PGCTLTIMEOUT: 600
    volumes:
      - postgres_data:/var/lib/postgresql
      - ..:/v6_api
      - ../docker/conf/postgresql.conf:/etc/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql.conf"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10m

  elasticsearch:
    # Elasticsearch 8 (+ analysis-icu). The index of the dev database is built at the first start
    # (.devcontainer/setup.sh, `make init-elastic`) and kept in the es_data volume.
    build:
      context: ..
      dockerfile: docker/Dockerfile.elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=4s"]
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: docker.io/library/redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  es_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      redis:
        condition: service_healthy
    # Navitia settings, read with os.getenv() by the API (the server does not load .env, only the tests do)
    env_file: ../.env
    environment:
      # Point services to their container hostnames
      PGHOST: postgresql
      PGUSER: postgres
      PGPASSWORD: test
      # alembic_migration has no __init__.py, so the editable install does not expose it:
      # without this, initialize_c2corg_api_db only works when run from /workspace
      PYTHONPATH: /workspace

  postgresql:
    # PostgreSQL 18 + PostGIS with a lightweight anonymized database (scripts/dev-database): it is restored
    # at the first start, a minute or so. The volume is mounted on /var/lib/postgresql (the layout of the
    # PostgreSQL 18 images), not on /var/lib/postgresql/data.
    image: ghcr.io/c2corg/c2corg-dev-db:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      # the restore ends with a checkpoint which can take more than the 60 s pg_ctl waits by default
      # on a slow disk (the first start would then fail)
      PGCTLTIMEOUT: 600
    volumes:
      - postgres_data:/var/lib/postgresql
      - ..:/v6_api
      - ../docker/conf/postgresql.conf:/etc/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql.conf"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    # Elasticsearch 2.4 with the index of the dev database (built with it by scripts/dev-database/publish.sh,
    # same tag). The data is in /esdata, a volume which starts from the content of the image.
    image: ghcr.io/c2corg/c2corg-dev-es:latest
    command: elasticsearch -Des.path.data=/esdata -Des.index.number_of_replicas=0 -Des.script.inline=true
    environment:
      ES_HEAP_SIZE: 512m
    volumes:
      - es_data:/esdata
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  es_data:

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "c2corg_api"
version = "0.0"
description = "c2corg_api"
readme = "README.md"
requires-python = "==3.14.*"
keywords = ["web", "wsgi", "bfg", "pylons", "pyramid"]
classifiers = [
    "Programming Language :: Python",
    "Framework :: Pyramid",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "alembic==1.14.1",
    "apscheduler==3.11.3",
    "bcrypt==4.3.0",
    "bleach[css]==6.2.0",
    "colander==2.0",
    "dogpile.cache==1.3.4",
    "elasticsearch==2.4.1",
    "elasticsearch_dsl==2.2.0",
    "geoalchemy2==0.4.2",
    "geojson==3.2.0",
    "geomet==1.1.0",
    "kombu==5.6.2",
    "Markdown==3.8.1",
    "phpserialize==1.3.0",  # phpserialize is only required during the migration
    "psycopg2-binary==2.9.11",
    "pyjwt==2.15.1",
    "pymdown-extensions==11.0.1",
    "pyproj==3.8.0",
    "pyramid_jwt==1.6.1",
    "pyramid==1.10.8",
    "pyramid_debugtoolbar==4.12.1",
    "pyramid_mailer==0.15.1",
    "pyramid_tm==2.3",
    "python-json-logger==3.3.0",
    "python-slugify==8.0.4",
    "redis==5.2.1",
    "requests==2.33.0",
    "setuptools==78.1.1",
    "Shapely==2.1.2",
    "SQLAlchemy==1.3.24",
    "transaction==5.0",
    "waitress==3.0.2",
    "zope.sqlalchemy==3.1",
    "gunicorn==23.0.0",
    "python-dotenv==1.2.2",
    "pytz==2026.4",
    # needs: https://github.com/stefanofontanelli/ColanderAlchemy/pull/90 + 91
    "ColanderAlchemy @ git+https://github.com/c2corg/ColanderAlchemy.git@v0.3.4+c2corg.1",
    # needs: https://github.com/mozilla-services/cornice/pull/359
    "cornice @ git+https://github.com/c2corg/cornice.git@6.1.0+c2corg",
    # Discourse API client
    "pydiscourse==1.7.0",
    "pygments>=2.21.0",  # not directly required, pinned by Snyk to avoid a vulnerability
    "numpy>=1.22.2",  # not directly required, pinned by Snyk to avoid a vulnerability
    "zipp>=3.19.1",  # not directly required, pinned by Snyk to avoid a vulnerability
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "WebTest==3.0.4",
    "ipdb==0.13.13",
    "httmock==1.4.0",
    "pytest~=8.3.5",
    "pytest-cov~=6.1.1",
    "pygments>=2.21.0",  # not directly required, pinned by Snyk to avoid a vulnerability
    "setuptools>=70.0.0",  # not directly required, pinned by Snyk to avoid a vulnerability
    "ipython>=8.10.0",  # not directly required, pinned by Snyk to avoid a vulnerability
]

[project.entry-points."paste.app_factory"]
main = "c2corg_api:main"

[project.scripts]
initialize_c2corg_api_db = "c2corg_api.scripts.initializedb:main"
initialize_c2corg_api_es = "c2corg_api.scripts.initializees:main"
fill_es_index = "c2corg_api.scripts.es.fill_index:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["c2corg_api*"]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
# Same checks as the former flake8 + pep8-naming setup. pycodestyle's
# whitespace and indentation rules (E1, E2, E3) are preview rules in ruff.
preview = true
select = ["E", "W", "F", "N", "UP"]
ignore = [
    "E226", "E241", "E242",  # in pycodestyle's default ignore list
    "N818",  # off by default in pep8-naming
    "N999",  # ruff-only: module names like scripts/redis-flushdb.py
    # String formatting (f-strings, "%" and "{0}".format) is left to a later
    # PR reviewed by hand: those fixes are unsafe (e.g. "%" with a tuple)
    # or produce lines too long to keep the change mechanical.
    "UP030", "UP031", "UP032",
    # unsafe fix (yield in a for loop -> yield from)
    "UP028",
]

[tool.pytest.ini_options]
addopts = "--cov=c2corg_api"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "c2corg_api"
version = "0.0"
description = "c2corg_api"
readme = "README.md"
requires-python = "==3.15.*"
keywords = ["web", "asgi", "fastapi"]
classifiers = [
    "Programming Language :: Python",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "alembic==1.20.1",
    "apscheduler==3.11.3",
    "bcrypt==5.0.0",
    "nh3==0.3.7",
    "dogpile.cache==1.5.0",
    "elasticsearch==2.4.1",
    "elasticsearch_dsl==2.2.0",
    "geoalchemy2==0.20.0",
    "geojson==3.3.0",
    "geomet==1.1.0",
    "kombu==5.7.0",
    "Markdown==3.11.3",
    "psycopg2-binary==2.9.13",
    "pyjwt==2.15.1",
    "pymdown-extensions==12.3",
    "pyproj==3.8.0",
    "python-json-logger==4.2.0",
    "python-slugify==9.1.3",
    "redis==7.4.1",
    "requests==2.34.2",
    "Shapely==2.2.0",
    "SQLAlchemy==2.1.4",
    "gunicorn==26.2.0",
    # the ASGI server, run by gunicorn: -k uvicorn_worker.UvicornWorker
    "uvicorn==0.54.0",
    "uvicorn-worker==0.4.0",
    "python-dotenv==1.2.4",
    # Discourse API client
    "pydiscourse==1.7.0",
    "pydantic==2.14.2",
    "fastapi==0.162.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    # the client of FastAPI's TestClient, for the tests
    "httpx2==2.16.0",
    "ipdb==0.13.13",
    "httmock==1.4.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[project.scripts]
initialize_c2corg_api_db = "c2corg_api.scripts.initializedb:main"
initialize_c2corg_api_es = "c2corg_api.scripts.initializees:main"
fill_es_index = "c2corg_api.scripts.es.fill_index:main"
reindex_es = "c2corg_api.scripts.es.reindex:main"
es_index_fingerprint = "c2corg_api.scripts.es.fingerprint:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["c2corg_api*"]

[tool.uv]
# fastapi's dependency, held to a release older than two weeks (the
# cooldown we apply to every dependency); drop when the next bump allows it
constraint-dependencies = ["starlette<=1.7.0"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
# Single quotes: what most of the code already used before ruff format.
quote-style = "single"

[tool.ruff.lint]
# Same checks as the former flake8 + pep8-naming setup. pycodestyle's
# whitespace and indentation rules (E1, E2, E3) are preview rules in ruff.
preview = true
# B: flake8-bugbear (likely bugs and design problems).
# D: docstring style (pep257 convention, see pydocstyle below).
# DTZ: no naive datetimes (the database columns are timestamptz).
# RUF100: report `# noqa` comments that no longer silence anything.
# S113: outbound HTTP requests must have a timeout (flake8-bandit).
select = ["E", "W", "F", "I", "N", "UP", "B", "D", "DTZ", "S113", "RUF100"]
ignore = [
    "E226", "E241", "E242",  # in pycodestyle's default ignore list
    "N818",  # off by default in pep8-naming
    "N999",  # ruff-only: module names like scripts/redis-flushdb.py
    # unsafe fix (yield in a for loop -> yield from)
    "UP028",
    # missing docstrings: only the style of existing docstrings is checked
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.per-file-ignores]
"c2corg_api/tests/**" = [
    "B006",  # helper defaults like `body={}` are never mutated
    "B017",  # `assertRaises(Exception)` is what the email test means
    "B018",  # a bare `response.json` checks that the body is JSON
    "B023",  # fake generators defined and used within one loop iteration
    "D",  # test docstrings describe test cases, not an API
    "DTZ",  # fixtures use naive UTC datetimes; the test database runs in UTC
    "S113",  # the conftest requests.get passthrough forwards the caller's timeout
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["c2corg_api", "es_migration"]

# Baseline (2026-10-23): 90% of lines and branches, tests excluded. CI fails
# below 89% (`--cov-fail-under` in ci.yml, not here: the Dependabot runs skip
# the navitia tests).
[tool.coverage.run]
source = ["c2corg_api"]
# the tests themselves are not part of the coverage figure
omit = ["c2corg_api/tests/*"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
addopts = "--cov=c2corg_api"
# a new warning fails the tests: fix it rather than hide it
filterwarnings = [
    "error",
    # shown, not raised: they come from the Elasticsearch 2 client (invalid
    # escapes in its code, seen when it is compiled) and the urllib3 1.26 it
    # holds (its vendored six changes http.client's __spec__); they go with
    # the move to Elasticsearch 8 (#2550)
    "default::SyntaxWarning:elasticsearch",
    "default::DeprecationWarning:elasticsearch",
    "default:Module globals:DeprecationWarning",
]
